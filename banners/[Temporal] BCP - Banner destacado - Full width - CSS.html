<table align="center" cellpadding="0" cellspacing="0" border="0" style="mso-table-lspace: 0; mso-table-rspace: 0; table-layout: fixed; width: 100%;">
  <tbody>
    <tr role="presentation">
      <th class="colspan1">
        <div class="acr-tmp-component" style="display:none;" data-contenteditable="true" data-tmp-component-id="html">
          <!--
            CSS de "BCP - Banner destacado - Full width"
            Colocar en el mismo contenedor apilado, junto al fragmento de markup.
            Sin este bloque el banner pierde el responsive: se queda fijo en 600px.
            A partir de 599px: icono 88px en fila, imagen 64px
          -->
          <style type="text/css">@media only screen and (max-width:599px){.bd-full{width:100% !important;max-width:100% !important;}table[class=bd-full]{width:100% !important;max-width:100% !important;}.bd-icon-hf{width:88px !important;max-width:88px !important;padding:12px 12px 12px 12px !important;}.bd-icon-hf img{width:64px !important;height:64px !important;}.bd-text-hf{padding:12px 12px 12px 0 !important;text-align:left !important;}}</style>
        </div>
      </th>
    </tr>
  </tbody>
</table>
