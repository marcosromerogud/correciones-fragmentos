<table align="center" cellpadding="0" cellspacing="0" border="0" style="mso-table-lspace: 0; mso-table-rspace: 0; table-layout: fixed; width: 100%;">
  <tbody>
    <tr role="presentation">
      <th class="colspan1">
        <div class="acr-tmp-component" style="display:none;" data-contenteditable="true" data-tmp-component-id="html">
          <!--
            CSS de "BCP - Banner destacado - Vertical - Sin Bordes"
            Colocar en el mismo contenedor apilado, junto al fragmento de markup.
            Sin este bloque el banner pierde el responsive: se queda fijo en 600px.
            A partir de 599px: apila el icono sobre el texto, centrado
          -->
          <style type="text/css">@media only screen and (max-width:599px){.bd-full{width:100% !important;max-width:100% !important;}table[class=bd-full]{width:100% !important;max-width:100% !important;}.bd-icon-v{display:block !important;width:auto !important;text-align:center !important;padding:16px 20px 0 !important;}.bd-text-v{display:block !important;text-align:center !important;padding:12px 20px 16px !important;}}</style>
        </div>
      </th>
    </tr>
  </tbody>
</table>
